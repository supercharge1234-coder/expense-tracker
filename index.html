<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="收支本" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="app-version" content="20261103g" />
  <title>日常收支本</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <section class="page active" id="pageList">
      <header class="header">
        <div class="header-top">
          <h1>收支本</h1>
          <button class="icon-btn" id="btnSettings" aria-label="设置">⚙️</button>
        </div>
        <div class="balance-card">
          <div class="balance-label">当前结余</div>
          <div class="balance-value" id="balance">¥ 0.00</div>
          <div class="balance-row">
            <div class="stat income">
              <span class="stat-label">本月收入</span>
              <span class="stat-value" id="monthIncome">¥ 0.00</span>
            </div>
            <div class="stat expense">
              <span class="stat-label">本月支出</span>
              <span class="stat-value" id="monthExpense">¥ 0.00</span>
            </div>
          </div>
        </div>
      </header>
      <div class="filter-bar">
        <select id="filterMonth"><option value="all">全部月份</option></select>
        <select id="filterType">
          <option value="all">全部</option>
          <option value="income">收入</option>
          <option value="expense">支出</option>
        </select>
        <select id="filterCategory"><option value="all">分类</option></select>
      </div>
      <main class="list" id="transactionList"></main>
      <div class="empty" id="emptyState">
        <div class="empty-icon">📝</div>
        <p>还没有记录</p>
        <p class="empty-hint">点右下角 + 开始记账</p>
      </div>
    </section>

    <section class="page" id="pageStats">
      <header class="header stats-header">
        <h1>统计</h1>
        <div class="stats-period">
          <select id="statsMonth"></select>
        </div>
      </header>

      <div class="stats-summary three">
        <div class="stats-sum-card income">
          <div class="label">收入</div>
          <div class="value" id="statsIncome">¥ 0.00</div>
        </div>
        <div class="stats-sum-card expense">
          <div class="label">支出</div>
          <div class="value" id="statsExpense">¥ 0.00</div>
        </div>
        <div class="stats-sum-card net">
          <div class="label">净余额</div>
          <div class="value" id="statsNet">¥ 0.00</div>
        </div>
      </div>

      <div class="chart-card highlight-card" id="topExpenseCard">
        <div class="chart-title">本月最大支出分类</div>
        <div class="top-expense" id="topExpense">
          <div class="top-emoji" id="topEmoji">📦</div>
          <div class="top-info">
            <div class="top-name" id="topName">暂无数据</div>
            <div class="top-amt" id="topAmt">—</div>
            <div class="top-pct" id="topPct"></div>
          </div>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title">每日累计净余额</div>
        <div class="trend-wrap">
          <canvas id="trendChart" width="340" height="160"></canvas>
        </div>
        <div class="trend-hint">折线：每天收入−支出后的累计结余</div>
      </div>

      <div class="chart-card">
        <div class="chart-title">每日明细（收入 / 支出 / 净额）</div>
        <div class="daily-list" id="dailyList"></div>
      </div>

      <div class="chart-card">
        <div class="chart-title">支出分类占比</div>
        <div class="pie-wrap">
          <canvas id="pieChart" width="200" height="200"></canvas>
          <div class="pie-center">
            <div class="pie-center-label">支出</div>
            <div class="pie-center-value" id="pieTotal">¥0</div>
          </div>
        </div>
        <div class="legend" id="expenseLegend"></div>
      </div>

      <div class="chart-card">
        <div class="chart-title">支出分类明细</div>
        <div class="bar-list" id="expenseBars"></div>
      </div>

      <div class="chart-card">
        <div class="chart-title">收入分类明细</div>
        <div class="bar-list" id="incomeBars"></div>
      </div>
    </section>

    <nav class="tabbar">
      <button class="tab active" data-page="pageList">
        <span class="tab-icon">📋</span>
        <span class="tab-label">明细</span>
      </button>
      <button class="tab" data-page="pageStats">
        <span class="tab-icon">📊</span>
        <span class="tab-label">统计</span>
      </button>
    </nav>

    <button class="fab" id="btnAdd" aria-label="添加">+</button>

    <div class="modal-overlay" id="modal">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <h2 id="modalTitle">添加记录</h2>
          <button class="icon-btn" id="btnCloseModal">✕</button>
        </div>
        <div class="type-tabs">
          <button class="type-tab active" data-type="expense">支出</button>
          <button class="type-tab" data-type="income">收入</button>
        </div>
        <form id="form">
          <input type="hidden" id="editId" />
          <div class="form-group">
            <label>金额</label>
            <div class="amount-input">
              <span id="amountSymbol">¥</span>
              <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required inputmode="decimal" />
            </div>
          </div>
          <div class="form-group">
            <label>分类</label>
            <div class="category-grid" id="categoryGrid"></div>
          </div>
          <div class="form-group">
            <label>备注</label>
            <input type="text" id="note" placeholder="可选，如：午饭、地铁…" maxlength="50" />
          </div>
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="date" required />
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-danger" id="btnDelete" style="display:none">删除</button>
            <button type="submit" class="btn btn-primary" id="btnSave">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
      <div class="modal settings-modal">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <h2>设置</h2>
          <button class="icon-btn" id="btnCloseSettings">✕</button>
        </div>
        <div class="settings-body">
          <div class="settings-group">
            <label class="settings-label">默认货币</label>
            <div class="currency-grid" id="currencyGrid"></div>
          </div>
          <button class="settings-item" id="btnExport">📤 导出数据</button>
          <button class="settings-item" id="btnImport">📥 导入数据</button>
          <button class="settings-item danger" id="btnClear">🗑️ 清空全部数据</button>
          <input type="file" id="importFile" accept=".json" hidden />
          <p class="settings-tip">数据保存在本机浏览器。建议定期导出备份。换手机前先导出再导入。</p>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    (function () {
      var VERSION = '20261103g';
      var KEY = 'expense_app_ver';

      // 注册 SW，并在有新版本时立刻接管
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          setInterval(function () { reg.update(); }, 10000);
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          reg.addEventListener('updatefound', function () {
            var w = reg.installing;
            if (!w) return;
            w.addEventListener('statechange', function () {
              if (w.state === 'installed' && navigator.serviceWorker.controller) {
                w.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch(function () {});
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          window.location.reload();
        });
      }

      // 每 10 秒检查服务器上的版本，有变化就自动刷新
      function check() {
        fetch('./index.html?_=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.text(); })
          .then(function (text) {
            var m = text.match(/app-version"\s+content="([^"]+)"/);
            if (m && m[1] && m[1] !== VERSION) {
              // 清掉旧缓存再刷新
              if (window.caches) {
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }).finally(function () { location.reload(true); });
              } else {
                location.reload(true);
              }
            }
          })
          .catch(function () {});
      }
      setInterval(check, 10000);
      // 首次稍后再查一次
      setTimeout(check, 3000);
    })();
  </script>
</body>
</html>
